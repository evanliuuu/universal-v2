<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal v2 — Day 4</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="chrome">
        <h1>Universal v2</h1>
        <p class="tagline">reflex → compiled → prefetch → agent (fast/big)</p>
        <div class="chrome-controls">
          <label>
            Agent
            <select id="agent-mode">
              <option value="mock" selected>Mock (no API)</option>
              <option value="openrouter">OpenRouter</option>
            </select>
          </label>
          <input id="instruct-input" type="text" placeholder="Instruction (big tier)…" />
          <button id="instruct-btn" type="button">Send</button>
          <button id="replay-btn" type="button" title="Replay event log from IndexedDB">Replay</button>
          <button id="reset-btn" type="button">Reset</button>
          <button id="clear-db-btn" type="button" title="Clear IndexedDB and reset">Clear DB</button>
        </div>
      </header>
      <div class="workspace">
        <aside class="panel">
          <p id="error-banner" class="error-banner" hidden></p>
          <p id="session-info" class="meta"></p>
          <p id="server-info" class="meta"></p>
          <p id="stats" class="meta"></p>
          <h2>Event log</h2>
          <pre id="event-log"></pre>
          <h2>State</h2>
          <pre id="state-view"></pre>
        </aside>
        <main class="viewport-wrap">
          <iframe
            id="universal-frame"
            title="Universal program viewport"
            sandbox="allow-scripts allow-same-origin"
          ></iframe>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
