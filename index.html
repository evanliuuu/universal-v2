<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal v2</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="chrome">
        <h1>Universal v2</h1>
        <p class="tagline">reflex → compiled → prefetch → agent (fast/big)</p>
        <div class="chrome-controls">
          <label>
            Agent
            <select id="agent-mode">
              <option value="mock" selected>Mock (no API)</option>
              <option value="openrouter">OpenRouter</option>
            </select>
          </label>
          <input id="instruct-input" type="text" placeholder="Instruction (big tier)…" />
          <button id="instruct-btn" type="button">Send</button>
          <button id="replay-btn" type="button" title="Replay event log from IndexedDB">Replay</button>
          <button id="share-btn" type="button" title="Copy multiplayer share link">Share</button>
          <button id="export-btn" type="button" title="Download session JSON">Export</button>
          <label class="import-label">
            Import
            <input id="import-input" type="file" accept="application/json,.json" hidden />
          </label>
          <button id="reset-btn" type="button">Reset</button>
          <button id="clear-db-btn" type="button" title="Clear IndexedDB and reset">Clear DB</button>
        </div>
      </header>
      <div class="workspace">
        <aside class="panel">
          <div id="error-card" class="error-banner" hidden>
            <strong id="error-title">Error</strong>
            <p id="error-banner"></p>
            <button id="retry-btn" type="button" hidden>Retry</button>
          </div>
          <p id="session-info" class="meta"></p>
          <p id="server-info" class="meta"></p>
          <h2>Session health</h2>
          <div id="health-dash" class="health-dash">
            <div class="health-row">
              <span>Tokens</span>
              <div class="bar" aria-label="Token usage">
                <div id="token-bar-fill" class="bar-fill"></div>
              </div>
              <span id="token-bar-label">0/50000</span>
            </div>
            <p id="latency-summary" class="meta"></p>
            <div id="latency-hist" class="latency-hist" aria-label="Latency histogram"></div>
            <p id="stats" class="meta"></p>
          </div>
          <h2>Event log</h2>
          <pre id="event-log"></pre>
          <h2>State</h2>
          <pre id="state-view"></pre>
        </aside>
        <main class="viewport-wrap">
          <iframe
            id="universal-frame"
            title="Universal program viewport"
            sandbox="allow-scripts allow-same-origin"
          ></iframe>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
