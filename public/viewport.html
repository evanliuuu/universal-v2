<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style id="uw-styles"></style>
  </head>
  <body>
    <div id="uw-root"></div>
    <script>
      const root = document.getElementById("uw-root");
      let resizeState = null;

      function applyUpdate(el, props, widgetType) {
        if (props.className != null) {
          el.className = ["uw", `uw-${widgetType}`, props.className]
            .filter(Boolean)
            .join(" ");
        }
        if (widgetType === "text" || widgetType === "label") {
          el.textContent = props.text ?? "";
        }
        if (widgetType === "button") {
          el.textContent = props.label ?? "Button";
          if (props.title != null) el.title = props.title;
        }
        if (widgetType === "input") {
          const active = document.activeElement === el;
          if (!active && props.value != null) el.value = props.value;
        }
        if (widgetType === "checkbox") {
          const input = el.querySelector("input[type=checkbox]");
          if (input && props.checked != null) input.checked = !!props.checked;
        }
        if (widgetType === "select" && props.value != null) {
          el.value = props.value;
        }
        if (widgetType === "slider" && props.value != null) {
          const input = el.querySelector("input[type=range]");
          if (input) input.value = String(props.value);
          const out = el.querySelector(".uw-slider-value");
          if (out) out.textContent = String(props.value);
        }
        if (widgetType === "menu" && props.open != null) {
          el.classList.toggle("open", !!props.open);
          const panel = el.querySelector(".uw-menu-panel");
          if (panel) panel.hidden = !props.open;
          const trigger = el.querySelector(".uw-menu-trigger");
          if (trigger) trigger.setAttribute("aria-expanded", props.open ? "true" : "false");
        }
        if (widgetType === "tabs" && props.activeTab != null) {
          el.querySelectorAll('[role="tab"]').forEach((btn) => {
            const id = (btn.dataset.widgetId || "").replace(/^tab-/, "");
            const on = id === props.activeTab;
            btn.classList.toggle("active", on);
            btn.setAttribute("aria-selected", on ? "true" : "false");
          });
        }
        if (widgetType === "dialog" && props.open != null) {
          el.hidden = !props.open;
        }
        if (widgetType === "icon") {
          if (props.glyph != null || props.emoji != null || props.label != null) {
            el.textContent = String(props.glyph ?? props.emoji ?? props.label ?? "•");
          }
          if (props.size != null) el.style.fontSize = `${Number(props.size)}px`;
          if (props.title != null) el.title = String(props.title);
        }
        if (widgetType === "image") {
          if (props.src != null) el.setAttribute("src", String(props.src));
          if (props.alt != null) el.setAttribute("alt", String(props.alt));
          if (props.width != null) el.setAttribute("width", String(props.width));
          if (props.height != null) el.setAttribute("height", String(props.height));
        }
        if (widgetType === "list") {
          const items = props.items ?? [];
          const selected = props.selectedId ?? "";
          el.innerHTML = items
            .map((item) => {
              const id = typeof item === "string" ? "" : (item.id ?? "");
              const label = typeof item === "string" ? item : (item.label ?? item);
              const sel = id && id === selected;
              const selectedAttr = sel ? " selected aria-selected=\"true\"" : " aria-selected=\"false\"";
              return `<li class="uw-list-item${sel ? " selected" : ""}" role="option" tabindex="0" data-item-id="${id ?? ""}"${selectedAttr}>${label ?? ""}</li>`;
            })
            .join("");
        }
      }

      function bindEvents() {
        document.addEventListener("click", (e) => {
          const close = e.target.closest('[data-action="close-window"]');
          if (close) {
            parent.postMessage(
              {
                source: "universal-viewport",
                type: "close_window",
                windowId: close.dataset.windowId,
              },
              "*",
            );
            return;
          }

          const closeDialog = e.target.closest('[data-action="close-dialog"]');
          if (closeDialog) {
            const dialog = closeDialog.closest("[data-widget-id]");
            if (dialog) {
              parent.postMessage(
                {
                  source: "universal-viewport",
                  type: "click",
                  targetId: dialog.dataset.widgetId,
                  value: "close",
                  behavior: "local",
                },
                "*",
              );
            }
            return;
          }

          const menuItem = e.target.closest(".uw-menu-item");
          if (menuItem) {
            const menu = menuItem.closest("[data-widget-id]");
            if (menu) {
              parent.postMessage(
                {
                  source: "universal-viewport",
                  type: "click",
                  targetId: menu.dataset.widgetId,
                  value: menuItem.dataset.menuItemId,
                  behavior: menu.dataset.behavior || "local",
                },
                "*",
              );
            }
            return;
          }

          const toggleMenu = e.target.closest('[data-action="toggle-menu"]');
          if (toggleMenu) {
            const menu = toggleMenu.closest("[data-widget-id]");
            if (menu) {
              parent.postMessage(
                {
                  source: "universal-viewport",
                  type: "click",
                  targetId: menu.dataset.widgetId,
                  value: "toggle",
                  behavior: menu.dataset.behavior || "local",
                },
                "*",
              );
            }
            return;
          }

          if (e.target.closest('[data-action="resize-window"]')) return;

          const item = e.target.closest(".uw-list-item");
          const el = e.target.closest("[data-widget-id]");
          if (!el) return;
          parent.postMessage(
            {
              source: "universal-viewport",
              type: "click",
              targetId: el.dataset.widgetId,
              widgetType: el.dataset.widgetType,
              behavior: el.dataset.behavior || "agent",
              value: item?.dataset.itemId,
            },
            "*",
          );
        });

        document.addEventListener("mousedown", (e) => {
          const handle = e.target.closest('[data-action="resize-window"]');
          if (!handle) return;
          e.preventDefault();
          const win = handle.closest(".uw-window-chrome");
          if (!win) return;
          const rect = win.getBoundingClientRect();
          resizeState = {
            windowId: handle.dataset.windowId,
            startX: e.clientX,
            startY: e.clientY,
            startW: rect.width,
            startH: rect.height,
          };
        });

        window.addEventListener("mousemove", (e) => {
          if (!resizeState) return;
          const width = Math.max(
            280,
            Math.round(resizeState.startW + (e.clientX - resizeState.startX)),
          );
          const height = Math.max(
            180,
            Math.round(resizeState.startH + (e.clientY - resizeState.startY)),
          );
          const win = root.querySelector(
            `[data-window-id="${resizeState.windowId}"]`,
          );
          if (win) {
            win.style.width = `${width}px`;
            win.style.height = `${height}px`;
          }
          resizeState.width = width;
          resizeState.height = height;
        });

        window.addEventListener("mouseup", () => {
          if (!resizeState || resizeState.width == null) {
            resizeState = null;
            return;
          }
          parent.postMessage(
            {
              source: "universal-viewport",
              type: "resize_window",
              windowId: resizeState.windowId,
              width: resizeState.width,
              height: resizeState.height,
            },
            "*",
          );
          resizeState = null;
        });

        document.addEventListener("input", (e) => {
          const el = e.target.closest("[data-widget-id]");
          if (!el) return;
          let value = el.value ?? el.textContent ?? "";
          const checkbox = el.querySelector?.("input[type=checkbox]");
          if (checkbox) value = checkbox.checked;
          const range = el.querySelector?.("input[type=range]");
          if (range) value = Number(range.value);
          if (el.tagName === "SELECT") value = el.value;
          parent.postMessage(
            {
              source: "universal-viewport",
              type: "input",
              targetId: el.dataset.widgetId,
              value,
              behavior: el.dataset.behavior || "local",
            },
            "*",
          );
        });

        document.addEventListener("keydown", (e) => {
          const target = e.target instanceof Element ? e.target : document.body;
          if (e.key === "Escape") {
            const dialog = root.querySelector(".uw-dialog-root:not([hidden])");
            if (dialog) {
              e.preventDefault();
              parent.postMessage(
                {
                  source: "universal-viewport",
                  type: "click",
                  targetId: dialog.dataset.widgetId,
                  value: "close",
                  behavior: "local",
                },
                "*",
              );
              return;
            }
            const win =
              target.closest(".uw-window-chrome") ||
              root.querySelector(".uw-window-chrome");
            if (win?.dataset.windowId) {
              e.preventDefault();
              parent.postMessage(
                {
                  source: "universal-viewport",
                  type: "close_window",
                  windowId: win.dataset.windowId,
                },
                "*",
              );
            }
            return;
          }

          const item = target.closest(".uw-list-item");
          if (item && (e.key === "Enter" || e.key === " ")) {
            e.preventDefault();
            item.click();
            return;
          }

          if (item && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
            e.preventDefault();
            const list = item.closest("[role=listbox]");
            const options = [...(list?.querySelectorAll(".uw-list-item") ?? [])];
            const idx = options.indexOf(item);
            const next =
              options[idx + (e.key === "ArrowDown" ? 1 : -1)] ?? item;
            next.focus();
            return;
          }

          if (
            target.matches('[role="tab"]') &&
            (e.key === "ArrowRight" || e.key === "ArrowLeft")
          ) {
            e.preventDefault();
            const tabs = [...target.parentElement.querySelectorAll('[role="tab"]')];
            const idx = tabs.indexOf(target);
            const next = tabs[idx + (e.key === "ArrowRight" ? 1 : -1)] ?? e.target;
            next.focus();
          }
        });

        document.addEventListener("change", (e) => {
          const target = e.target;
          if (!(target instanceof HTMLElement)) return;
          const checkbox = target.closest("input[type=checkbox]");
          const select = target.closest("select");
          const range = target.closest("input[type=range]");
          const el = target.closest("[data-widget-id]");
          if (!el) return;
          let value;
          if (checkbox) value = checkbox.checked;
          else if (select) value = select.value;
          else if (range) value = Number(range.value);
          else return;
          parent.postMessage(
            {
              source: "universal-viewport",
              type: "input",
              targetId: el.dataset.widgetId,
              value,
              behavior: el.dataset.behavior || "local",
            },
            "*",
          );
        });
      }

      window.addEventListener("message", (e) => {
        const data = e.data;
        if (!data || data.target !== "universal-viewport") return;

        if (data.type === "FULL") {
          const styleEl = document.getElementById("uw-styles");
          if (styleEl) styleEl.textContent = data.css ?? "";
          if (data.theme) document.body.dataset.theme = data.theme;
          root.innerHTML = data.html ?? "";
          return;
        }

        if (data.type === "PATCH") {
          if (data.theme) document.body.dataset.theme = data.theme;
          for (const patch of data.patches ?? []) {
            if (patch.op === "update") {
              const el = root.querySelector(`[data-widget-id="${patch.id}"]`);
              if (!el) continue;
              applyUpdate(el, patch.props, el.dataset.widgetType);
            } else if (patch.op === "replace") {
              const el = root.querySelector(`[data-widget-id="${patch.id}"]`);
              if (el) el.outerHTML = patch.html;
            } else if (patch.op === "append") {
              const parentEl = root.querySelector(
                `[data-widget-id="${patch.parentId}"]`,
              );
              if (parentEl) parentEl.insertAdjacentHTML("beforeend", patch.html);
            } else if (patch.op === "remove") {
              root.querySelector(`[data-widget-id="${patch.id}"]`)?.remove();
            }
          }
        }
      });

      bindEvents();
      parent.postMessage({ source: "universal-viewport", type: "ready" }, "*");
    </script>
  </body>
</html>
